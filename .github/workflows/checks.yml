name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validate syntax, manifest, and paths
        run: node scripts/check.mjs
      - name: Test playback and account behavior
        run: node --test tests/*.test.js
      - name: Check release commit messages
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/check-commits.mjs
      - name: Build installer
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anime365-${{ github.sha }}
          path: dist/*.iinaplgz
          retention-days: 7
